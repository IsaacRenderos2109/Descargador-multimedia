name: Tests and Windows build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libopengl0
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: ruff check src tests scripts app.py gui.py desktop.py
      - run: ruff format --check src tests scripts app.py gui.py desktop.py
      - run: mypy
      - name: Type check Windows target
        run: mypy --platform win32
      - run: python scripts/check_runtime.py
      - run: python -m pytest -q --junitxml=test-results.xml
      - name: Report test failures as annotations
        if: failure()
        run: python scripts/report_test_failures.py test-results.xml
      - run: python scripts/smoke_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml

  windows-build:
    needs: test
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - name: Build application
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Boot frozen application without network
        shell: pwsh
        run: |
          $process = Start-Process dist/VideoDownloader/VideoDownloader.exe -ArgumentList '--smoke-test' -PassThru
          if (!$process.WaitForExit(30000)) { $process.Kill(); throw 'Startup timeout' }
          if ($process.ExitCode -ne 0) { throw "Startup failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-Windows-x64
          path: dist/VideoDownloader/
          retention-days: 14
