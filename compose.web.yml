services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MEDIA_PROXY: http://egress-proxy:3128
      JOB_ROOT: /data/jobs
    command:
      - uvicorn
      - web_service.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    volumes:
      - web_jobs:/data/jobs
    depends_on:
      egress-proxy:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  egress-proxy:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    command: ["python", "/app/infra/egress_proxy.py"]
    expose:
      - "3128"
    networks:
      backend: {}
      outbound:
        gw_priority: 1
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m,mode=1777
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 3128), timeout=2).close()"]
      interval: 20s
      timeout: 3s
      start_period: 5s
      retries: 3

networks:
  backend:
    internal: true
  outbound: {}

volumes:
  web_jobs:
